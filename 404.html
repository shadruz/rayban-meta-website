<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#3155ec" />
    <title>Страница не найдена — TechGeek.uz</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #171b20;
        background: #f8f9fc;
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #3155ec;
        outline-offset: 6px;
      }
      header,
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 6vw;
        padding: 30px 0;
        gap: 20px;
      }
      header {
        border-bottom: 1px solid #dce0e8;
      }
      .brand {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -1.2px;
      }
      .brand span {
        color: #3155ec;
      }
      .location {
        font-size: 12px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      main {
        width: min(1100px, 88vw);
        margin: auto;
        padding: 76px 0;
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        align-items: center;
        gap: 60px;
      }
      .code {
        font-size: clamp(120px, 23vw, 280px);
        line-height: 0.8;
        letter-spacing: -0.09em;
        font-weight: 800;
        color: #3155ec;
        user-select: none;
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #636b78;
      }
      h1 {
        font-size: clamp(34px, 4vw, 56px);
        line-height: 1.07;
        letter-spacing: -0.05em;
        max-width: 550px;
        margin: 18px 0 24px;
      }
      p {
        color: #636b78;
        font-size: 16px;
        line-height: 1.7;
        max-width: 430px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 30px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 17px 22px;
        border: 1px solid #dce0e8;
        border-radius: 7px;
        font-weight: 600;
        font-size: 14px;
      }
      .button.primary {
        background: #3155ec;
        color: #fff;
        border-color: #3155ec;
      }
      .button:hover {
        background: #e9edff;
      }
      .button.primary:hover {
        background: #2345d5;
      }
      footer {
        border-top: 1px solid #dce0e8;
        font-size: 12px;
        color: #636b78;
      }
      @media (max-width: 700px) {
        header,
        footer {
          margin: 0 6vw;
          padding: 24px 0;
        }
        .location {
          font-size: 10px;
        }
        main {
          grid-template-columns: 1fr;
          gap: 40px;
          padding: 64px 0;
        }
        .code {
          font-size: 150px;
        }
        footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        .actions .button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="TechGeek.uz — главная"
        >techgeek<span>.uz</span></a
      ><span class="location">Tashkent · Uzbekistan</span>
    </header>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <div>
        <span class="eyebrow">Кажется, вы свернули не туда</span>
        <h1>Этой страницы<br />здесь нет.</h1>
        <p>
          А умные очки и WHOOP — есть. Вернитесь в каталог или свяжитесь с нами:
          поможем найти нужную модель.
        </p>
        <div class="actions">
          <a class="button primary" href="/#catalog"
            >В каталог <span aria-hidden="true">&nbsp;↗</span></a
          ><a class="button" href="tel:+998992999900">Позвонить</a>
        </div>
      </div>
    </main>
    <footer>
      <span>Оригинальные устройства. TechGeek.uz</span
      ><a
        href="https://www.instagram.com/techgeek.uz/"
        target="_blank"
        rel="noopener noreferrer"
        >Instagram ↗</a
      >
    </footer>
  </body>
</html>
